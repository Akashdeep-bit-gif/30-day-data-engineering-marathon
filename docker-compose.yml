version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: data_engineering_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pipeline:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db

volumes:
  postgres_data:
